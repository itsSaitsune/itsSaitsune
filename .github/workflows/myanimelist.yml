name: Update MyAnimeList watchlist

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/myanimelist.yml"

permissions:
  contents: write

concurrency:
  group: myanimelist-watchlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate card and place beside Spotify
        shell: python
        run: |
          import html
          import json
          import os
          import re
          import time
          import urllib.request
          from pathlib import Path
          
          url = "https://myanimelist.net/animelist/Saitsune/load.json?status=1&offset=0"
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      entries = json.load(response)
                  if not isinstance(entries, list):
                      raise ValueError("MyAnimeList returned an unexpected response")
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(10 * (attempt + 1))
          
          entries = [item for item in entries if item.get("status") == 1]
          entries.sort(key=lambda item: item.get("updated_at", 0), reverse=True)
          parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="400" height="320" viewBox="0 0 400 320" role="img" aria-labelledby="title desc">',
                   '<title id="title">Saitsune — Currently Watching</title>',
                   '<desc id="desc">MyAnimeList currently watching list, refreshed every twelve hours.</desc>',
                   '<rect x=".5" y=".5" width="399" height="319" rx="10" fill="#282a36" stroke="#44475a"/>',
                   '<g font-family="Segoe UI,Arial,sans-serif"><text x="20" y="30" fill="#ff79c6" font-size="18" font-weight="600">Currently Watching</text>',
                   '<text x="20" y="49" fill="#b5b7ca" font-size="11">Saitsune · MyAnimeList</text>']
          for index, item in enumerate(entries[:5]):
              y = 76 + index * 45
              name = item["anime_title"]
              display = name if len(name) <= 44 else name[:41] + "…"
              watched = int(item.get("num_watched_episodes") or 0)
              total = int(item.get("anime_num_episodes") or 0)
              label = f"Episode {watched} / {total if total else '?'}"
              parts.append(f'<text x="20" y="{y}" fill="#f8f8f2" font-size="13"><title>{html.escape(name)}</title>{html.escape(display)}</text>')
              parts.append(f'<text x="20" y="{y+17}" fill="#bd93f9" font-size="11">{label}</text>')
          if not entries:
              parts.append('<text x="20" y="90" fill="#f8f8f2" font-size="13">No anime marked Currently Watching.</text>')
          parts.append('<text x="20" y="303" fill="#b5b7ca" font-size="10">View full list on MyAnimeList ↗</text></g></svg>')
          Path("assets").mkdir(exist_ok=True)
          Path("assets/currently-watching.svg").write_text("".join(parts), encoding="utf-8")
          
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          section = """<table align="center">
            <tr>
              <td align="center" valign="top" width="50%">
                <a href="https://open.spotify.com/user/21ur2gstabc6i4xwx54n4qfjq">
                  <img src="https://spotify-recently-played-readme.vercel.app/api?user=21ur2gstabc6i4xwx54n4qfjq&amp;count=5" width="400" alt="Spotify recently played" />
                </a>
              </td>
              <td align="center" valign="top" width="50%">
                <a href="https://myanimelist.net/animelist/Saitsune?status=1">
                  <img src="assets/currently-watching.svg" width="400" alt="Saitsune's currently watching anime on MyAnimeList" />
                </a>
              </td>
            </tr>
          </table>"""
          if 'src="assets/currently-watching.svg"' not in content:
              content, count = re.subn(r'<div data-importer="music" align="center">.*?</div>', lambda match: section, content, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError("Spotify section changed; README was not edited")
              readme.write_text(content, encoding="utf-8")
          
      - name: Publish watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/currently-watching.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update currently watching anime"
          git pull --rebase origin main
          git push origin HEAD:main

