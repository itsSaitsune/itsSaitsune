name: Update MyAnimeList watchlist

on:
  workflow_dispatch:
  schedule:
    - cron: "27 */12 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/myanimelist.yml"

permissions:
  contents: write

concurrency:
  group: myanimelist-watchlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate card and place beside Spotify
        shell: python
        run: |
          import html
          import json
          import os
          import re
          import time
          import urllib.request
          from pathlib import Path
          
          url = "https://myanimelist.net/animelist/Saitsune/load.json?status=1&offset=0"
          for attempt in range(3):
              try:
                  req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
                  with urllib.request.urlopen(req, timeout=45) as response:
                      entries = json.load(response)
                  if not isinstance(entries, list):
                      raise ValueError("MyAnimeList returned an unexpected response")
                  break
              except Exception:
                  if attempt == 2:
                      raise
                  time.sleep(10 * (attempt + 1))
          
          entries = [item for item in entries if item.get("status") == 1]
          entries.sort(key=lambda item: item.get("updated_at", 0), reverse=True)
          import base64
          import concurrent.futures
          
          def embed_image(url):
              if not url.startswith("https://"):
                  return ""
              request = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
              with urllib.request.urlopen(request, timeout=20) as response:
                  data = response.read(2_000_000)
                  mime = response.headers.get_content_type().replace("image/jpg", "image/jpeg")
              if mime not in ("image/jpeg", "image/png", "image/webp", "image/svg+xml"):
                  raise ValueError("Unexpected image content type")
              return "data:" + mime + ";base64," + base64.b64encode(data).decode()
          
          logo = 'data:image/svg+xml;base64,'
          def cover(item):
              try:
                  return embed_image(item.get("anime_image_path", ""))
              except Exception as error:
                  print("Cover unavailable:", item.get("anime_id"), type(error).__name__)
                  return ""
          
          with concurrent.futures.ThreadPoolExecutor(max_workers=5) as pool:
              covers = list(pool.map(cover, entries[:5]))
          parts = ['<svg xmlns="http://www.w3.org/2000/svg" width="400" height="328" viewBox="0 0 400 328" role="img" aria-labelledby="title desc">',
                   '<title id="title">MyAnimeList Currently Watching — Saitsune</title>',
                   '<desc id="desc">Five currently watching anime with cover art and episode progress.</desc>',
                   '<rect x=".5" y=".5" width="399" height="327" rx="10" fill="#151b23" stroke="#2a323d"/>',
                   '<g font-family="Segoe UI,Arial,sans-serif">',
                   f'<image x="16" y="12" width="25" height="25" href="{logo}"/>',
                   '<text x="47" y="30" fill="#2e51a2" font-size="14" font-weight="600">MyAnimeList</text>',
                   '<text x="139" y="30" fill="#e9eef5" font-size="16" font-weight="600">Currently Watching</text>',
                   '<path d="M16 48H384" stroke="#232b36"/>']
          for index, (item, image) in enumerate(zip(entries[:5], covers)):
              y = 60 + index * 56
              name = item["anime_title"]
              display = name if len(name) <= 40 else name[:37] + "…"
              watched = int(item.get("num_watched_episodes") or 0)
              total = int(item.get("anime_num_episodes") or 0)
              link = "https://myanimelist.net/anime/" + str(int(item["anime_id"]))
              parts.append(f'<a href="{link}" target="_blank"><title>{html.escape(name)}</title>')
              parts.append(f'<clipPath id="cover{index}"><rect x="16" y="{y}" width="32" height="32" rx="4"/></clipPath>')
              parts.append(f'<rect x="16" y="{y}" width="32" height="32" rx="4" fill="#2a323d"/>')
              if image:
                  parts.append(f'<image x="16" y="{y}" width="32" height="32" href="{image}" clip-path="url(#cover{index})" preserveAspectRatio="xMidYMid slice"/>')
              else:
                  parts.append(f'<path d="M28 {y+10}l10 6-10 6z" fill="#7d8b9c"/>')
              parts.append(f'<text x="60" y="{y+12}" fill="#e9eef5" font-size="14" font-weight="600">{html.escape(display)}</text>')
              parts.append(f'<text x="60" y="{y+31}" fill="#9fadbd" font-size="13">Episode {watched} / {total if total else "?"}</text></a>')
              if index < 4:
                  parts.append(f'<path d="M16 {y+43.5}H384" stroke="#232b36"/>')
          if not entries:
              parts.append('<text x="16" y="80" fill="#9fadbd" font-size="13">No anime marked Currently Watching.</text>')
          parts.append('</g></svg>')
          Path("assets").mkdir(exist_ok=True)
          Path("assets/currently-watching.svg").write_text("".join(parts), encoding="utf-8")
          
          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          section = """<table align="center">
            <tr>
              <td align="center" valign="top" width="50%">
                <a href="https://open.spotify.com/user/21ur2gstabc6i4xwx54n4qfjq">
                  <img src="https://spotify-recently-played-readme.vercel.app/api?user=21ur2gstabc6i4xwx54n4qfjq&amp;count=5" width="400" alt="Spotify recently played" />
                </a>
              </td>
              <td align="center" valign="top" width="50%">
                <a href="https://myanimelist.net/animelist/Saitsune?status=1">
                  <img src="assets/currently-watching.svg" width="400" alt="Saitsune's currently watching anime on MyAnimeList" />
                </a>
              </td>
            </tr>
          </table>"""
          if 'src="assets/currently-watching.svg"' not in content:
              content, count = re.subn(r'<div data-importer="music" align="center">.*?</div>', lambda match: section, content, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError("Spotify section changed; README was not edited")
              readme.write_text(content, encoding="utf-8")
          
      - name: Publish watchlist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/currently-watching.svg README.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Update currently watching anime"
          git pull --rebase origin main
          git push origin HEAD:main


